name: Publish data release

on:
  push:
    tags:
      - "data-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Verify tag and data
        shell: bash
        run: |
          set -euo pipefail
          build_id="$(python -c 'import json; print(json.load(open("data/normalized/current/dataset-manifest.json"))["game_build_id"])')"
          test "$GITHUB_REF_NAME" = "data-v${build_id}"
          pytest -q
          gw2-wvw-data validate --dataset data/normalized/current
      - name: Build release artifacts
        run: gw2-wvw-data release --dataset data/normalized/current --output dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "GW2 WvW Thief data ${GITHUB_REF_NAME}" \
            --generate-notes
