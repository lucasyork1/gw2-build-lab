name: Validate data

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Validate current dataset
        run: |
          if test -f data/normalized/current/dataset-manifest.json; then
            gw2-wvw-data validate --dataset data/normalized/current
          else
            echo "No current dataset has been published yet."
          fi
