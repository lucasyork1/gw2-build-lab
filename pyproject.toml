[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gw2-wvw-thief-data"
version = "0.1.0"
description = "Versioned Guild Wars 2 WvW Thief build data tooling"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
gw2-wvw-data = "gw2_wvw_data.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
